name: Pull server stats

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - name: Pull stats over SFTP
        env:
          RUN_ONCE:     'true'
          PUBLISH_MODE: 'local'
          LOCAL_PATH:   './stats.json'
          FTP_HOST:     ${{ secrets.FTP_HOST }}
          FTP_USER:     ${{ secrets.FTP_USER }}
          FTP_PASS:     ${{ secrets.FTP_PASS }}
          PROTOCOL:     ${{ secrets.PROTOCOL || 'sftp' }}
          FTP_PORT:     ${{ secrets.FTP_PORT }}
          FTP_REMOTE:   ${{ secrets.FTP_REMOTE || '/server-data/Lua/pr_stats.json' }}
        run: node pr-bridge-ftp.js

      - name: Commit if the numbers changed
        run: |
          git config user.name  "pr-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "stats $(date -u +%H:%M)"
          git push
